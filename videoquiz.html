<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vídeo-quiz · Blockchain</title>
<style>
:root{--or:#DF7A1E;--gr:#8FBA3B;--bg:#201F1A;--card:#2c2b25;--ko:#e04545;--tx:#f4f1ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,Arial,Helvetica,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--or)}
header h1{font-size:18px;margin:0}
header .sc{font-weight:700;color:var(--gr)}
main{width:min(960px,100%);padding:14px}
.start{background:var(--card);border-radius:14px;padding:22px;text-align:center}
.logo{display:inline-block;background:#fff;border-radius:12px;padding:8px 16px;margin-bottom:6px}
.logo img{height:56px;display:block}
.tt{font-size:clamp(22px,4.5vw,36px);margin:10px 0 4px}
.how{font-size:clamp(16px,2.6vw,20px);margin:6px 0 14px}
.warn{background:#3a2a10;border:3px solid var(--or);border-radius:12px;padding:14px;margin:10px auto 16px;max-width:640px;display:flex;flex-direction:column;gap:6px}
.warn b{font-size:clamp(20px,4vw,30px);color:var(--or)}
.warn span{font-size:clamp(16px,3vw,22px)}
.warn .zero{font-weight:800;color:#ff8a7a;font-size:clamp(18px,3.4vw,26px)}
.err{color:#ff8a7a;font-weight:700;min-height:1.3em;margin:0}
.start input{padding:12px;border-radius:8px;border:0;font-size:18px;width:min(380px,90%)}
button{font:inherit;border:0;border-radius:10px;padding:13px 22px;font-weight:700;cursor:pointer;color:#fff;background:var(--or);font-size:17px}
button:disabled{opacity:.5;cursor:default}
.wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
#player{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;background:rgba(20,19,16,.93);display:none;flex-direction:column;justify-content:center;padding:4%;gap:12px;overflow:auto}
.ov.on{display:flex}
.ov h2{margin:0;font-size:clamp(17px,3.2vw,28px)}
.ov small{color:var(--or);font-weight:700;letter-spacing:1px}
.opts{display:grid;gap:10px}
.opt{background:#3a392f;text-align:left;font-weight:600;border:2px solid transparent}
.opt:hover:enabled{border-color:var(--or)}
.opt.ok{background:var(--gr);color:#1b2a05}
.opt.ko{background:var(--ko)}
.fb{font-size:clamp(14px,2.4vw,19px);min-height:2.6em}
.bar{height:8px;background:#3a392f;border-radius:6px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--or);width:0;transition:width .3s}
.final{text-align:center}
.final .big{font-size:clamp(40px,10vw,84px);color:var(--gr);font-weight:800}
.hide{display:none}
</style>
</head>

    <h2 class="tt">Vídeo-quiz · Què és la blockchain?</h2>
    <p class="how">El vídeo s'aturarà sol per fer-te preguntes. Respon bé per continuar.</p>
    <div class="warn">
      <b>⚠ ESCRIU EL TEU NOM I COGNOMS BÉ</b>
      <span>Tal com surten a Classroom (ex.: <i>Anna Almagro Artime</i>).</span>
      <span class="zero">Si el nom no és correcte, la teva nota serà un 0.</span>
    </div>
    <p><input id="nom" placeholder="Nom i cognoms" maxlength="60" autocomplete="off"></p>
    <p id="err" class="err"></p>
    <p><button id="go">▶ Començar</button></p>
  </div>
  <div id="game" class="hide">
    <div class="bar"><i id="pb"></i></div>
    <div class="wrap">
      <div id="player"></div>
      <div class="ov" id="ov">
        <small id="qn"></small>
        <h2 id="qt"></h2>
        <div class="opts" id="opts"></div>
        <div class="fb" id="fb"></div>
        <button id="cont" class="hide">Continuar el vídeo ▶</button>
      </div>
      <div class="ov final" id="fin">
        <small>FINAL</small>
        <div class="big" id="fs"></div>
        <h2 id="fm"></h2>
        <p id="sent" style="opacity:.8"></p>
        <p><button id="again">↻ Tornar-ho a provar</button></p>
      </div>
    </div>
  </div>
</main>

<script>
const VIDEO_ID='Yn8WGaO__ak';
const VIDEO_NOM='Blockchain (PlayGround)';
// Resultats -> Google Form «Vídeo-quiz · resultats» (arriben al Sheet vinculat)
const FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLSdh7vkOl9Jo0uBTuqOckSpT9-4KPGn0WLU51g6CVnhe7t2qYA/formResponse';
const F_NOM='entry.39799410',F_VIDEO='entry.533370763',F_NOTA='entry.1367269633';
function enviaNota(){
  const fd=new URLSearchParams();fd.append(F_NOM,nom);fd.append(F_VIDEO,VIDEO_NOM);fd.append(F_NOTA,score+'/'+Q.length);
  return fetch(FORM_URL,{method:'POST',mode:'no-cors',body:fd}).then(()=>true).catch(()=>false);
} // «Què és Blockchain en 5 minuts» · PlayGround
// t = segon on s'atura; o = opcions; c = índex de la correcta; e = explicació
const Q=[
 {t:37,q:"Segons el vídeo, qui farà la feina de gestionar i guardar la informació amb la blockchain?",o:["Persones, més ràpides","Ordinadors: incorruptibles, eficaços i cada cop més veloços","Els bancs i els notaris"],c:1,e:"Passem de la gestió humana (lenta i corruptible) a ordinadors incorruptibles."},
 {t:60,q:"Com es protegeix la blockchain dels atacs?",o:["Amb un superantivirus","Amb un firewall molt potent","Gràcies a la seva pròpia estructura: una cadena de blocs"],c:2,e:"S'autoprotegeix per la seva arquitectura, no amb antivirus ni firewall."},
 {t:101,q:"Quines tres coses té cada bloc?",o:["Informació, el seu hash i el hash del bloc anterior","Només la informació","Nom de l'usuari, contrasenya i data"],c:0,e:"Informació + el seu hash (DNI únic) + el hash del bloc anterior: així s'encadenen."},
 {t:136,q:"Què passa amb el hash si algú canvia la informació d'un bloc?",o:["No passa res","Canvia automàticament i el bloc deixa d'encaixar a la cadena","S'esborra tota la cadena"],c:1,e:"Com una peça de trencaclosques: si canvia la forma, deixa d'encaixar i la cadena queda invalidada."},
 {t:158,q:"Cert o fals: a la blockchain hi ha una única base de dades guardada en un banc.",o:["Cert","Fals"],c:1,e:"Fals. Cada usuari té una còpia: molts ulls miren alhora, i si algú la altera, la comunitat ho detecta."},
 {t:195,q:"Què fan els miners (en castellà, «mineros»)?",o:["Vigilen que ningú faci trampes","Creen nous blocs resolent un problema matemàtic molt complex","Reparteixen els diners entre els usuaris"],c:1,e:"Posen els processadors a tot gas per afegir un nou bloc, i cobren una recompensa."},
 {t:224,q:"Quan un miner creu que ha resolt el problema, qui comprova que la solució és correcta?",o:["Un banc central","El mateix miner","La resta de la comunitat"],c:2,e:"La comunitat ho verifica; si és correcte, el bloc s'afegeix a la cadena."},
 {t:252,q:"Qui va crear el Bitcoin el 2009 (amb pseudònim)?",o:["Elon Musk","Satoshi Nakamoto","Mark Zuckerberg"],c:1,e:"Satoshi Nakamoto, una identitat que encara avui ningú sap qui és."},
 {t:292,q:"Pensa en una cuina: com ajudaria la blockchain amb la procedència dels aliments?",o:["Faria els plats més ràpid","Faria impossible falsejar-ne l'origen i detectaria si es trenca la cadena de fred","Rebaixaria el preu del producte"],c:1,e:"És la traçabilitat: seguir el producte des de l'origen fins al consumidor sense poder falsejar-ho."}
];
const $=id=>document.getElementById(id);
let yt,idx=0,score=0,poll=null,asking=false,ready=false,nom='',fails=0;
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{
  yt=new YT.Player('player',{videoId:VIDEO_ID,playerVars:{rel:0,modestbranding:1,playsinline:1,cc_load_policy:0,hl:'ca'},
    events:{onReady:()=>{ready=true},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)finish()}}});
};
$('go').onclick=()=>{
  nom=$('nom').value.trim().replace(/\s+/g,' ');
  if(nom.split(' ').length<2||nom.length<5){ $('err').textContent='Escriu el teu nom i cognoms complets per començar.'; return; }
  $('err').textContent='';
  $('start').classList.add('hide');$('game').classList.remove('hide');
  idx=0;score=0;asking=false;upd();
  const begin=()=>{ if(!ready){setTimeout(begin,200);return} yt.seekTo(0,true);yt.playVideo();clearInterval(poll);poll=setInterval(tick,250)};
  begin();
};
function upd(){ $('sc').textContent=nom+' · '+score+' / '+Q.length; $('pb').style.width=(idx/Q.length*100)+'%'; }
function tick(){
  if(asking||idx>=Q.length)return;
  const cur=yt.getCurrentTime();
  if(cur>=Q[idx].t){ yt.pauseVideo(); yt.seekTo(Q[idx].t,true); ask(); }
}
function ask(){
  asking=true;fails=0;const q=Q[idx];
  $('qn').textContent='PREGUNTA '+(idx+1)+' DE '+Q.length;
  $('qt').textContent=q.q;$('fb').textContent='';$('cont').classList.add('hide');
  const box=$('opts');box.innerHTML='';
  q.o.forEach((txt,i)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=txt;
    b.onclick=()=>answer(i,b);box.appendChild(b);
  });
  $('ov').classList.add('on');
}
function answer(i,btn){
  const q=Q[idx];const bs=[...$('opts').children];
  if(i===q.c){
    bs.forEach(b=>b.disabled=true);btn.classList.add('ok');if(fails===0)score++;
    $('fb').textContent='✔ Correcte! '+q.e;
    $('cont').classList.remove('hide');upd();
  }else{
    btn.classList.add('ko');btn.disabled=true;fails++;
    $('fb').textContent='✘ Torna-ho a provar…';
  }
}
$('cont').onclick=()=>{
  $('ov').classList.remove('on');idx++;asking=false;upd();
  if(idx>=Q.length){ /* deixa acabar el vídeo */ }
  yt.playVideo();
};
function finish(){
  clearInterval(poll);
  if(asking)return;
  $('fs').textContent=score+' / '+Q.length;
  $('fm').textContent=nom+(score>=Q.length-1?': ets un crack de la blockchain! ⛓️':score>=Q.length/2?': bona feina, ja ho tens quasi!':': torna a veure el vídeo i repeteix-ho.');
  $('fin').classList.add('on');
  $('sent').textContent='Enviant la teva nota…';
  enviaNota().then(ok=>{$('sent').textContent=ok?'✔ Nota enviada al professor':"No s'ha pogut enviar la nota (fes una captura!)"});
}
$('again').onclick=()=>{$('fin').classList.remove('on');$('sent').textContent='';$('go').onclick()};
</script>
</body>
